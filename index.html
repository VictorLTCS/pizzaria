<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tony Pizzaria</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./Atividade - Pizzaria/Group 2.png" alt="Tony Pizzaria">
        </div>
        <div class="home">
            <img src="./Atividade - Pizzaria/Group 1.png" alt="Home, Cardápio, Serviços, Localização, Contato">
        </div>
    </header>

    <main>
        <div class="hero">
            <img class="titulo" src="/Atividade - Pizzaria/Não é apenas uma Pizza, é uma experiência!.png" alt="Não é apenas uma Pizza, é uma experiência!">
            <img class="pizza" src="./Atividade - Pizzaria/image.png" alt="Pizza de calabresa">
        </div>

        <div class="galeria">
            <img src="./Atividade - Pizzaria/image 2.png" alt="Pizza de pepperoni">
            <img src="./Atividade - Pizzaria/image 3.png" alt="Fatia de pizza com queijo">
            <img src="./Atividade - Pizzaria/image 5.png" alt="Pizza com tomate">
            <img src="./Atividade - Pizzaria/image 4.png" alt="Fatia de pizza com queijo">
        </div>
    </main>
</body>
</html>
